[package]
name = "optflow-app"
edition.workspace = true
version.workspace = true
license.workspace = true
description = "Desktop app (egui, CPU only) for the optflow soil-strain phase tracking"

[[bin]]
name = "optflow-app"
path = "src/main.rs"

[dependencies]
optflow-core = { path = "../optflow-core" }
optflow-cli = { path = "../optflow-cli" }
anyhow = "1"
rayon = "1.10"
image = { version = "0.25", default-features = false, features = ["png", "tiff", "jpeg", "bmp"] }
serde_json = { workspace = true }
rfd = "0.15"
eframe = { version = "*", default-features = false, features = ["default_fonts", "glow", "x11", "wayland"] }
egui_plot = "*"


[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
objc2-foundation = { version = "0.3", default-features = false, features = ["std", "NSProcessInfo", "NSString", "NSObject"] }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_System_Power", "Win32_System_Threading"] }
