name: macos

# Tests of optflow-core, optflow-cli and optflow-app on macOS, with the default features and with
# the Metal backend (`gpu`, the build that is released). A runner without a usable Metal device
# skips the tests that need one and prints why; the crate optflow-gpu itself is not tested here.
on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  macos:
    runs-on: macos-latest
    defaults:
      run:
        working-directory: rust
    steps:
      - uses: actions/checkout@v4

      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            rust/target
          key: macos-${{ hashFiles('rust/Cargo.lock') }}
          restore-keys: macos-

      - name: ffmpeg (for the CLI tests that decode video)
        continue-on-error: true
        run: brew install ffmpeg

      - name: Test optflow-core, optflow-cli, optflow-app
        run: cargo test --release --no-fail-fast -p optflow-core -p optflow-cli -p optflow-app

      - name: Test optflow-cli, optflow-app with the Metal backend
        run: cargo test --release --no-fail-fast -p optflow-cli -p optflow-app --features optflow-cli/gpu,optflow-app/gpu
